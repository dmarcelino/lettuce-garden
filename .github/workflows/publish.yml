# Publishes a release (release/README.md): on a vX.Y.Z or vX.Y.Z-rc.N tag, and
# only after every check of ci.yml passes. Nothing is published from main, and
# there is no `latest`: the lolloctl image holds the Docker socket, so a
# moving tag would let one push reach every host.
#
# Each platform builds on a runner of its own architecture (ubuntu-24.04 for
# linux/amd64, ubuntu-24.04-arm for linux/arm64), never under emulation, which
# was ten times slower; a job per image then joins the two into one image.
#
# 1. plan: the images, from release/images (the one list).
# 2. build (one job per image and platform): its content tag
#    (release/content-tag); when that tag is not in the registry yet, the
#    image for that platform, pushed by digest only, with an SBOM and BuildKit
#    provenance.
# 3. image (one job per image): the content tag on both platforms' digests, so
#    an unchanged image keeps its name and digest; and a GitHub attestation.
# 4. release-file: RELEASE (the version, the tested Lettuce tag, each image's
#    full name), once every image is published for both platforms.
# 5. ctl (one job per platform): the lolloctl image, carrying RELEASE, pushed
#    by digest.
# 6. release: the lolloctl image's tag on both digests, the wrapper pinned to
#    its digest, SHA256SUMS, the release notes (which images changed, and so
#    which sidecars restart), and the GitHub release.
# The GHCR packages it creates come out public, as this repository is, so hosts
# pull without credentials (release/README.md, "Cutting a release", step 3).
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          v=$(cat VERSION)
          t=${TAG#v}
          [[ ${t%-rc.*} == "$v" ]] || { echo "::error::VERSION ($v) and the tag ($TAG) disagree"; exit 1; }
      - id: images
        run: |
          set -eu
          printf 'images=%s\n' "$(awk '!/^[[:space:]]*(#|$)/ { print $1, $2, $3 }' release/images |
            jq -Rnc '[inputs | split(" ") | {image: .[0], context: .[1], shared: .[2]}]')" >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.images) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ${{ matrix.target.image }}
      CONTEXT: ${{ matrix.target.context }}
      SHARED: ${{ matrix.target.shared }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest, unless this content is published already
        run: |
          set -euo pipefail
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lollo-$IMAGE
          tag=$(release/content-tag "$IMAGE")
          mkdir -p "$RUNNER_TEMP/digest"
          if docker buildx imagetools inspect "$name:$tag" >/dev/null 2>&1; then
            echo "$IMAGE: $name:$tag is published; reused"
            echo reused >"$RUNNER_TEMP/digest/$ARCH"
            exit 0
          fi
          args=(--platform "linux/$ARCH" --provenance mode=max --sbom true
            --output "type=image,name=$name,push-by-digest=true,name-canonical=true,push=true"
            --metadata-file "$RUNNER_TEMP/meta.json" -f "$CONTEXT/Dockerfile")
          [[ $SHARED == - ]] || args+=(--build-context "$SHARED=$SHARED")
          docker buildx build "${args[@]}" "$CONTEXT"
          jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json" >"$RUNNER_TEMP/digest/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # By exact name: an image's name can start another's (code-server,
      # code-server-editor), so a pattern would also fetch the other image's
      # digests, whose files have the same names and overwrite these.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms' digests, unless this content is published already
        id: build
        run: |
          set -euo pipefail
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lollo-$IMAGE
          tag=$(release/content-tag "$IMAGE")
          if digest=$(docker buildx imagetools inspect "$name:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "$IMAGE: $name:$tag is published; reused"
            built=false
          else
            refs=()
            for f in "$RUNNER_TEMP"/digests/*; do
              d=$(cat "$f")
              [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$IMAGE has no $(basename "$f") build ($d)"; exit 1; }
              refs+=("$name@$d")
            done
            docker buildx imagetools create -t "$name:$tag" "${refs[@]}"
            digest=$(docker buildx imagetools inspect "$name:$tag" --format '{{json .Manifest}}' | jq -er .digest)
            built=true
          fi
          {
            echo "name=$name"
            echo "digest=$digest"
            echo "built=$built"
          } >>"$GITHUB_OUTPUT"
          key=LOLLO_IMAGE_$(tr 'a-z-' 'A-Z_' <<<"$IMAGE")
          mkdir -p "$RUNNER_TEMP/ref"
          echo "$key=$name:$tag@$digest" >"$RUNNER_TEMP/ref/$IMAGE.env"
      - if: steps.build.outputs.built == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ref-${{ matrix.image }}
          path: ${{ runner.temp }}/ref/${{ matrix.image }}.env
          retention-days: 1

  release-file:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ref-*
          path: ${{ runner.temp }}/ref
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write RELEASE and check every image is published for both platforms
        run: |
          set -euo pipefail
          {
            echo "VERSION=${TAG#v}"
            echo "LETTUCE_REF=$(sed -n 's/^LETTUCE_REF=//p' config.env.example)"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            awk '!/^[[:space:]]*(#|$)/ { print $1 }' release/images | while read -r img; do
              cat "$RUNNER_TEMP/ref/$img.env"
            done
          } >RELEASE
          cat RELEASE
          # compose build --push has exited 0 having pushed nothing (upstream's
          # publish.yml); this reads the registry back.
          sed -n 's/^LOLLO_IMAGE_[A-Z_]*=//p' RELEASE | while read -r ref; do
            p=$(docker buildx imagetools inspect --raw "$ref" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ")')
            [[ " $p " == *" linux/amd64 "* && " $p " == *" linux/arm64 "* ]] || { echo "::error::$ref is not published for both platforms ($p)"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RELEASE
          path: RELEASE
          if-no-files-found: error
          retention-days: 1

  ctl:
    needs: release-file
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RELEASE
          path: .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the lolloctl image and push it by digest
        run: |
          set -euo pipefail
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lolloctl
          mkdir -p "$RUNNER_TEMP/digest"
          docker buildx build --platform "linux/$ARCH" --provenance mode=max --sbom true \
            --output "type=image,name=$name,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/ctl.json" -f release/lolloctl.Dockerfile .
          jq -er '."containerimage.digest"' "$RUNNER_TEMP/ctl.json" >"$RUNNER_TEMP/digest/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctl-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: ctl
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RELEASE
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ctl-digest-*
          path: ${{ runner.temp }}/ctl
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the lolloctl image on both platforms' digests
        id: ctl
        run: |
          set -euo pipefail
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lolloctl
          refs=()
          for arch in amd64 arm64; do
            d=$(cat "$RUNNER_TEMP/ctl/$arch")
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no lolloctl build for $arch"; exit 1; }
            refs+=("$name@$d")
          done
          docker buildx imagetools create -t "$name:$TAG" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$name:$TAG" --format '{{json .Manifest}}' | jq -er .digest)
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ctl.outputs.name }}
          subject-digest: ${{ steps.ctl.outputs.digest }}
          push-to-registry: true
      - name: Write the wrapper, SHA256SUMS and the release notes
        env:
          IMAGE: ${{ steps.ctl.outputs.name }}:${{ github.ref_name }}@${{ steps.ctl.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          sed -e "s|@VERSION@|$TAG|" -e "s|@IMAGE@|$IMAGE|" -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|" \
            release/lolloctl-wrapper.sh >dist/lolloctl
          if grep -q '@[A-Z]*@' dist/lolloctl; then echo "::error::the wrapper still has a placeholder"; exit 1; fi
          cp RELEASE dist/RELEASE
          (cd dist && sha256sum lolloctl RELEASE >SHA256SUMS)
          # The images whose name changed since the last release: their
          # containers restart on self-upgrade; a changed vault relocks.
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          : >"$RUNNER_TEMP/prev"
          [[ -z $prev ]] || gh release download "$prev" --pattern RELEASE --output "$RUNNER_TEMP/prev" --clobber || true
          {
            echo "lollo-rozzo $TAG, tested with Lettuce $(sed -n 's/^LETTUCE_REF=//p' RELEASE)."
            echo
            echo "Install or upgrade: release/README.md. Verify the wrapper: \`gh attestation verify lolloctl --repo $GITHUB_REPOSITORY\`."
            echo
            if [[ -z $prev ]]; then
              echo "First release: every container is new."
            else
              changed=$(comm -13 <(grep '^LOLLO_IMAGE_' "$RUNNER_TEMP/prev" | sort) <(grep '^LOLLO_IMAGE_' RELEASE | sort) | cut -d= -f1 | sed 's/^LOLLO_IMAGE_//' | tr 'A-Z_' 'a-z-')
              if [[ -z $changed ]]; then
                echo "No lollo image changed since $prev: no sidecar restarts."
              else
                echo "Images changed since $prev (their containers restart on self-upgrade):"
                for i in $changed; do echo "- $i"; done
                if grep -qx vault <<<"$changed"; then
                  echo
                  echo "**The vault's image changed: every person must unlock their vault again after the upgrade.**"
                fi
              fi
            fi
          } >dist/NOTES.md
          cat dist/NOTES.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/lolloctl
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          flags=()
          [[ $TAG != *-rc.* ]] || flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file dist/NOTES.md "${flags[@]}" dist/lolloctl dist/RELEASE dist/SHA256SUMS
