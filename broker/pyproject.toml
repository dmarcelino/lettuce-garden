[project]
name = "secret-broker"
version = "0.1.0"
description = "Lettuce vault: personal data agents may use only when the user agrees"
requires-python = ">=3.12"
# Pinned: this is an application image, rebuilt on every `lettucectl up`.
dependencies = [
  "mcp==2.3.0",
  "anyio==4.15.1",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "jinja2==3.1.6",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "pywebpush==2.5.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secret_broker = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
