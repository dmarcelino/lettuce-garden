{% extends "base.html" %}
{% block title %}Add a secret{% endblock %}
{% block content %}
<h1>What would you like to keep?</h1>
<ul class="menu-list">
  {% for key, kind in kinds.items() %}
  <li>
    <a class="menu-row" href="{{ base }}/vault/new?kind={{ key }}">
      <span class="menu-row-text">
        <span class="menu-row-title">{{ kind.label }}</span>
        <span class="menu-row-desc">{{ kind.fields|map(attribute="label")|join(", ") }}</span>
      </span>
    </a>
  </li>
  {% endfor %}
</ul>
<p><a href="{{ base }}/vault">Cancel</a></p>
{% endblock %}
