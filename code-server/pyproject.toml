[project]
name = "code-server-gate"
version = "0.1.0"
description = "Lettuce Garden sidecar: the Access-checked gate in front of the code editor (code-server)"
requires-python = ">=3.12"
# Pinned: this is an application image, rebuilt on every `lettucectl up`. Shared
# libraries use the vault's pins. garden-common is installed by the Dockerfile
# from its build context and deliberately not listed here, so pip never looks
# for a package of that name on PyPI.
dependencies = [
  "anyio==4.15.1",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "websockets==17.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_server_gate = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
