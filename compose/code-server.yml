# Merged by lettucectl on top of upstream/docker/compose.yml for every stack.
# The code editor (code-server/, docs/code-server.md): VS Code in the browser at
# https://<host>/garden/code-server/, on the agents' workspaces. Opt-in behind
# the `code-server` profile; without it this file adds nothing.
#
# Three services, because the editor shares an origin with Lettuce and the vault
# and must never run what agents wrote:
# - code-server, the gate: the tunnel forwards /garden/code-server/ (and /garden/
#   when it is the first garden page) to it. It checks the Access JWT on every
#   request and WebSocket, strips the prefix and lets only listed headers and
#   pages through. It is the only service on `default` and the only way in.
# - code-server-editor: code-server itself, on code-editor (the gate only) and
#   code-exec (the shell only). It edits the workspaces and runs no workspace
#   code: Restricted Mode for good, a pruned set of built-in extensions, nothing
#   installable, and terminals and git sent to the shell.
# - code-server-exec, the shell: the app-server's own image plus an SSH server,
#   with the workspaces and the agents' tools mounted as in the app-server. It
#   is as strong as an agent and holds nothing an agent can't get: no Access
#   token, no Google token, no credentials. Its only way out is code-egress.
# `lettucectl check` refuses a stack where any of them loses its networks,
# mounts or hardening, or another service joins their networks or volumes.
# Relative paths resolve against --project-directory (upstream/docker).
services:
  code-server:
    profiles: ["code-server"]
    build:
      context: ../../code-server
      additional_contexts:
        garden-common: ../../garden-common
    image: lettuce-code-server:local
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # The /garden/ landing page links only to the garden pages that are on.
      GARDEN_PROFILES: ${GARDEN_PROFILES:-}
      TZ: ${TZ:-UTC}
    networks:
      - default
      - code-editor
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

  code-server-editor:
    profiles: ["code-server"]
    build:
      context: ../../code-server/editor
    image: lettuce-code-server-editor:local
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - none
      - --disable-proxy
      - --disable-telemetry
      - --disable-update-check
      - --disable-getting-started-override
      - --extensions-dir
      - /opt/lettuce-editor/no-extensions
      - --user-data-dir
      - /data/user
    environment:
      # An empty gallery: no marketplace, so nothing can be searched or installed.
      EXTENSIONS_GALLERY: "{}"
      TZ: ${TZ:-UTC}
    # Root (with no capabilities) because agents write the workspaces as root.
    user: "0"
    volumes:
      - ${LETTA_STATE_DIR:?LETTA_STATE_DIR is not set}/workspaces:/work
      - code-server-data:/data
      - code-exec-keys:/keys
    networks:
      - code-editor
      - code-exec
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped

  code-server-exec:
    profiles: ["code-server"]
    build:
      context: ../../code-server/exec
      additional_contexts:
        # The app-server's image, whatever upstream builds it as.
        base: service:app-server
    image: lettuce-code-server-exec:local
    # PID 1 keeps the container's environment for agent-env.
    init: true
    working_dir: /work
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${LETTA_STATE_DIR:?LETTA_STATE_DIR is not set}/workspaces:/work
      - ${LETTA_STATE_DIR:?LETTA_STATE_DIR is not set}/tools:/opt/agent-tools
      - code-exec-keys:/keys:ro
    networks:
      - code-exec
      - code-egress
    # Docker's default capabilities, so apt and pip work until the next recreate.
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    pids_limit: 4096
    depends_on:
      - code-server-editor
    restart: unless-stopped

networks:
  code-editor:
    internal: true
  code-exec:
    internal: true
  code-egress: {}

volumes:
  code-server-data: {}
  code-exec-keys: {}
