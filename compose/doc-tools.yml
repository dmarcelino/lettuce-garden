# Merged by lolloctl after compose/landing.yml, only when the stack has the
# `lollo-doc-tools` profile (the `compose` wrapper in lib/common.sh). Gives the
# app-server the document tools (doc-tools/, docs/doc-tools.md):
#
# - the tools' volume, mounted read-only at /opt/lollo-doc-tools: one copy
#   per host, shared by every stack, which lolloctl fills from the doc-tools
#   image (DOC_TOOLS_VOLUME, lollo-doc-tools-<tag>). It holds OfficeAgent and
#   the PDF MCP, which Lettuce starts as stdio MCP servers (Settings -> MCP), one
#   process per call. The tag is the image's content hash, so a change in
#   doc-tools/ is a new volume and Compose recreates the app-server. A volume,
#   not an image mount: Docker 29 brings image mounts back empty after a daemon
#   restart. `external`, so `down -v` never removes it.
# - the stack's own internal network to the host's shared Gotenberg
#   (compose/shared/gotenberg.yml), which converts documents to PDF. lolloctl
#   creates it (DOC_TOOLS_NETWORK, lollo-doc-tools-<name>) and connects
#   Gotenberg to it; Compose only joins it, so `down` never removes it.
#   `default` is listed too: naming any network drops the implicit one, and with
#   it cloudflared, the vault and every other service of the stack.
#
# This adds to an upstream service (a mount and a network) instead of
# restricting it: a named exception in compose/README.md ("Rules"). It
# replaces nothing.
# `lolloctl check` refuses a stack where the mount is not this read-only
# volume, where another service mounts it or joins the network, or where the
# app-server loses `default`.
services:
  app-server:
    volumes:
      - type: volume
        source: doc-tools
        target: /opt/lollo-doc-tools
        read_only: true
        volume:
          nocopy: true
    networks:
      - default
      - doc-tools

networks:
  doc-tools:
    external: true
    name: ${DOC_TOOLS_NETWORK:?set by lolloctl}

volumes:
  doc-tools:
    external: true
    name: ${DOC_TOOLS_VOLUME:?set by lolloctl}
