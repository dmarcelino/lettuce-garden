# Merged by lolloctl on top of upstream/docker/compose.yml for every stack.
# Pipelock (pipelock/, docs/egress-firewall.md): an egress proxy that checks
# where the agents' tools connect and signs a receipt for every decision.
# Opt-in behind the `lollo-pipelock` profile; without it this file adds nothing.
# compose/pipelock-proxy.yml, merged only with the profile, points the agents'
# tools at it.
#
# Advisory: the stack network keeps its direct route, so a process that ignores
# HTTPS_PROXY or unsets it goes around it.
# No TLS interception: for HTTPS it sees the host name, not the content.
#
# Its data (the receipt signing key and the receipts) lives on a named volume
# that no other service mounts; `lolloctl check` refuses a stack where one
# does, or where this service loses its hardening or gains a host path.
# Relative paths resolve against --project-directory (upstream/docker).
services:
  lollo-pipelock:
    profiles: ["lollo-pipelock"]
    build:
      context: ${LOLLO_HOME:?LOLLO_HOME is not set}/pipelock
    image: ${LOLLO_IMAGE_PIPELOCK:-lollo-pipelock:local}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - pipelock-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Every model call of the stack's agents passes it (letta-code follows
    # HTTPS_PROXY), each an open tunnel for as long as the model works.
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

volumes:
  # Deleted by `lolloctl remove` (compose down -v) with the stack. Not under
  # stacks/<name>/, where agents could write; `lolloctl backup` copies it
  # from a one-off container that mounts it read-only.
  pipelock-data:
