# Merged by lettucectl on top of upstream/docker/compose.yml for every stack.
# The vault (broker/, docs/secret-broker.md): each person's personal data,
# encrypted with their passphrase, shared with agents only when they agree.
# Opt-in behind the `secrets` profile; without it this file adds nothing.
#
# Agents reach it at http://secret-broker:8000/mcp over the stack network, and
# the tunnel forwards https://<name>-garden.<domain>/secrets/ to it
# (cf_tunnel_configure). That reachability is not the control: approving, and
# every page of the UI, needs a Cloudflare Access JWT of the garden's own Access
# application, which agents cannot forge. Lettuce's JWT, which cloudflared hands
# the BFF in plain HTTP inside the namespace agents share, is for another
# audience, so the vault refuses it (`lettucectl check` refuses a stack where it
# would not).
#
# Its data (the encrypted vault file) lives on a named volume that no other
# service mounts; `lettucectl check` refuses a stack where one does, or
# where this service loses read_only or cap_drop ALL, gains privileges,
# capabilities, devices, another service's namespaces or mounts, or a bind mount.
# Relative paths resolve against --project-directory (upstream/docker).
services:
  secret-broker:
    profiles: ["secrets"]
    build:
      context: ../../broker
      # The shared package (Access JWT and CSRF checks) both garden images install.
      additional_contexts:
        garden-common: ../../garden-common
    image: lettuce-secret-broker:local
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      # The garden's own Access application and host, never Lettuce's.
      CF_ACCESS_AUD: ${CF_GARDEN_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      PUBLIC_ORIGIN: ${GARDEN_ORIGIN:-}
      BROKER_VAPID_PUBLIC_KEY: ${BROKER_VAPID_PUBLIC_KEY:-}
      BROKER_VAPID_PRIVATE_KEY: ${BROKER_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_CONTACT_EMAIL: ${PUSH_VAPID_CONTACT_EMAIL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - secret-broker-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # scrypt needs 128 MiB per unlock.
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

volumes:
  # Deleted by `lettucectl remove` (compose down -v): removing a stack deletes
  # its vault. Not under stacks/<name>/; `lettucectl backup` copies it from a
  # one-off container that mounts it read-only.
  secret-broker-data:
