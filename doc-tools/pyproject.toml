[project]
name = "pdf-mcp"
version = "0.1.0"
description = "Lettuce document tools: a stdio MCP server for PDF files in an agent's workspace"
requires-python = ">=3.12"
# Pinned: the doc-tools image is rebuilt when anything in doc-tools/ changes.
# PyMuPDF is AGPL-3.0; the image is built on the operator's host and never published.
# 1.28.x, not 2.0: 2.0 was days old when this was written.
dependencies = [
  "mcp==2.3.0",
  "pymupdf==1.28.2",
  "pypdf[crypto]==6.21.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
