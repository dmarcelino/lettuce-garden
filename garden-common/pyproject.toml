[project]
name = "garden-common"
version = "0.1.0"
description = "Shared code for the lettuce-multi-user garden sidecars"
requires-python = ">=3.12"
# Pinned like the sidecars that install it; keep these in step with them.
dependencies = [
  "anyio==4.15.1",
  "pyjwt[crypto]==2.15.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garden_common = ["static/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
