[project]
name = "garden-landing"
version = "0.1.0"
description = "Lettuce Garden service: the landing page at the root of the garden's host, with the agent list"
requires-python = ">=3.12"
# Pinned: this is an application image, rebuilt on every `lettucectl up`. Shared
# libraries use the vault's pins. garden-common is installed by the Dockerfile
# from its build context and deliberately not listed here, so pip never looks
# for a package of that name on PyPI.
dependencies = [
  "anyio==4.15.1",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garden_landing = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
