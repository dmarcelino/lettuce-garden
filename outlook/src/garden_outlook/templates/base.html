<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf" content="{{ csrf }}">
  <meta name="base" content="{{ base }}">
  <meta name="theme-color" content="#e7eaf0">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Outlook{% endblock %} - Lettuce Garden</title>
  <link rel="icon" href="{{ base }}/icon-192.png">
  <link rel="stylesheet" href="{{ base }}/garden.css">
  <link rel="stylesheet" href="{{ base }}/app.css">
  <script src="{{ base }}/app.js" defer></script>
</head>
<body data-csrf="{{ csrf }}">
  <header class="topbar">
    <div class="topbar-inner">
      <img class="app-icon" src="{{ base }}/icon-192.png" width="28" height="28" alt="">
      <a class="title" href="{{ base }}/">Outlook</a>
      <a class="topbar-note" href="/">Lettuce Garden</a>
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  {% if email %}<footer class="footer">Signed in as {{ email }}</footer>{% endif %}
</body>
</html>
