{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
{% if notice %}<div class="banner ok" role="status"><p>{{ notice }}</p></div>{% endif %}
<section class="panel">
  <h2>Change passphrase</h2>
  <form method="post" action="{{ base }}/settings/passphrase" class="stack" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field">Current passphrase <input type="password" name="old" required autocomplete="current-password"></label>
    <label class="field">New passphrase <input type="password" name="new" required minlength="12" autocomplete="new-password"><span class="hint">At least 12 characters.</span></label>
    <label class="field">New passphrase again <input type="password" name="confirm" required minlength="12" autocomplete="new-password"></label>
    <button class="button">Change passphrase</button>
  </form>
</section>
<section class="panel danger">
  <h2>Erase the vault</h2>
  <form method="post" action="{{ base }}/settings/reset" class="stack" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p>Deletes every secret and the history, for good. Use it if you want to start again with a new passphrase.</p>
    <label class="field">Type DELETE to confirm <input name="confirm" required></label>
    <button class="button danger outline">Erase everything</button>
  </form>
</section>
{% endblock %}
